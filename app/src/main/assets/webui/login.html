<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FerryFile — Login</title>
  <link rel="stylesheet" href="/webui/style.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>FerryFile</h1>
      <p class="subtitle">Enter the PIN shown in the FerryFile app</p>

      <form id="login-form">
        <div class="form-group">
          <label for="pin">PIN</label>
          <input
            id="pin"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            autocomplete="off"
            autofocus
            required
          />
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Unlock</button>
      </form>

      <div id="error-msg" class="message error" role="alert"></div>
    </div>
  </div>

  <script>
    (function () {
      var form = document.getElementById('login-form');
      var pinInput = document.getElementById('pin');
      var submitBtn = document.getElementById('submit-btn');
      var errorMsg = document.getElementById('error-msg');

      function showError(text) {
        errorMsg.textContent = text;
        errorMsg.classList.add('visible');
      }

      function clearError() {
        errorMsg.textContent = '';
        errorMsg.classList.remove('visible');
      }

      pinInput.addEventListener('input', function () {
        pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 6);
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        clearError();

        var pin = pinInput.value;
        if (pin.length !== 6) {
          showError('The PIN is 6 digits');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Checking…';

        fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pin })
        })
          .then(function (res) {
            if (res.ok) {
              window.location.href = '/files';
              return;
            }
            if (res.status === 429) {
              showError('Too many attempts, wait 30s');
            } else if (res.status === 401) {
              showError('Wrong PIN');
              pinInput.value = '';
              pinInput.focus();
            } else {
              showError('Unexpected error, please try again');
            }
            submitBtn.disabled = false;
            submitBtn.textContent = 'Unlock';
          })
          .catch(function () {
            showError('Network error, please try again');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Unlock';
          });
      });
    })();
  </script>
</body>
</html>
